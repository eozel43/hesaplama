name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Playwright browsers (populate cache)
        run: npx playwright install --with-deps

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ./dist

      - name: Install dependencies (tests)
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Start static server for built site
        run: npx http-server ./dist -p 5173 -c-1 &

      - name: Wait for server
        run: npx wait-on http://localhost:5173 --timeout 120000

      - name: Run Playwright tests (${ { matrix.browser } })
        env:
          CI: true
        run: npx playwright test --project=${{ matrix.browser }} --config=playwright.config.ts --reporter=list

      - name: Upload Playwright HTML report (per-browser)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
