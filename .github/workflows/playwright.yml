name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ./dist

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Start static server for built site
        run: |
          npx http-server ./dist -p 5173 -c-1 > server.log 2>&1 &
          sleep 1
          cat server.log

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:5173 --timeout 120000

      - name: Run Playwright tests (${{ matrix.browser }})
        env:
          CI: true
        run: npx playwright test --project=${{ matrix.browser }} --config=playwright.config.ts --reporter=list

      - name: Upload server log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.browser }}
          path: server.log

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
